<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>일일 원두 재고 관리</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div><h1>일일 원두 재고 관리</h1><p>1~8파트 통합 조회 · 일일 입고/사용량 등록</p></div><button id="refresh">새로고침</button></header>
<main><nav id="parts"></nav><section class="cards"><article>선택 파트<strong id="part">1파트</strong></article><article>매장 수<strong id="count">-</strong></article><article>기준일<strong id="day">-</strong></article><article>연결 상태<strong id="connection">확인 중</strong></article></section>
<section class="panel"><div class="tools"><input id="search" placeholder="매장명 검색"><input id="date" type="date"><button id="lookup">조회</button></div>
<div class="scroll"><table><thead><tr><th>매장</th><th>평일 평균매출</th><th>평일 평균 사용량</th><th>주말 평균 사용량</th><th>주말 평균매출</th><th>전일재고</th><th>입고</th><th>사용</th><th>잔여재고</th><th>저장</th></tr></thead><tbody id="rows"><tr><td colspan="10">조회 중...</td></tr></tbody></table></div></section>
<p class="note">평균 사용량은 선택 월의 실제 입력된 사용량을 평일(월~금)과 주말(토·일)로 나누어 계산합니다. 미입력은 제외하고 입력된 0은 포함합니다.</p>
</main><div id="toast" role="status"></div><script src="config.js"></script><script src="app.js"></script></body></html>
